<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TastySteps|Delecious Recipes</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #fffaf5;
    color: #222;
}

header {
    background: #ff6b35;
    color: white;
    padding: 25px 18px;
    text-align: center;
}

header h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

header p {
    font-size: 15px;
}

.search-box {
    max-width: 700px;
    margin: 20px auto;
    padding: 0 15px;
}

.search-box input {
    width: 100%;
    padding: 15px 18px;
    border: 2px solid #eee;
    border-radius: 30px;
    font-size: 16px;
    outline: none;
}

.categories {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 5px 15px 20px;
    max-width: 1000px;
    margin: auto;
}

.category {
    border: none;
    background: white;
    padding: 10px 18px;
    border-radius: 25px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.category:hover {
    background: #ff6b35;
    color: white;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 10px 15px 40px;
}

.container h2 {
    margin: 10px 0 20px;
}

.recipes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-4px);
}

.card-img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.card-content {
    padding: 16px;
}

.card-content h3 {
    margin-bottom: 8px;
}

.card-content p {
    color: #777;
    font-size: 14px;
    margin-bottom: 12px;
}

.buttons {
    display: flex;
    gap: 8px;
}

.view-btn {
    flex: 1;
    background: #ff6b35;
    color: white;
    border: none;
    padding: 11px;
    border-radius: 10px;
    cursor: pointer;
}

.favorite {
    width: 45px;
    background: #fff0eb;
    border: none;
    border-radius: 10px;
    font-size: 20px;
    cursor: pointer;
}

.favorite.active {
    background: #ffe0d6;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    padding: 20px;
    z-index: 1000;
    overflow-y: auto;
}

.modal-box {
    background: white;
    max-width: 650px;
    margin: 30px auto;
    border-radius: 20px;
    padding: 25px;
    position: relative;
}

.close {
    position: absolute;
    right: 18px;
    top: 12px;
    border: none;
    background: none;
    font-size: 30px;
    cursor: pointer;
}

.modal-box img {
    width: 100%;
    max-height: 300px;
    object-fit: cover;
    border-radius: 15px;
    margin-bottom: 20px;
}

.modal-box h2 {
    margin-bottom: 15px;
}

.modal-box h3 {
    margin-top: 20px;
    margin-bottom: 10px;
}

.modal-box ul,
.modal-box ol {
    padding-left: 22px;
    line-height: 1.8;
}

footer {
    background: #222;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 30px;
}

.no-results {
    text-align: center;
    padding: 40px;
    color: #777;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 27px;
    }

    .recipes {
        grid-template-columns: 1fr;
    }

    .card-img {
        height: 210px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🍴 Foodie Recipes</h1>
    <p>Delicious recipes made simple</p>
</header>

<div class="search-box">
    <input
        type="text"
        id="search"
        placeholder="🔍 Search recipes..."
        onkeyup="searchRecipes()"
    >
</div>

<div class="categories">
    <button class="category" onclick="filterCategory('All')">All</button>
    <button class="category" onclick="filterCategory('Breakfast')">🍳 Breakfast</button>
    <button class="category" onclick="filterCategory('Lunch')">🍛 Lunch</button>
    <button class="category" onclick="filterCategory('Dinner')">🍗 Dinner</button>
    <button class="category" onclick="filterCategory('Dessert')">🍰 Dessert</button>
</div>
<div class="community-post-box">
  <h2>Share Your Cooked Dish</h2>
  <form id="userRecipeForm">
    <input type="text" id="postTitle" placeholder="Recipe Title (e.g., Spicy Karahi)" required>
    <input type="text" id="postAuthor" placeholder="Your Name" required>
    <textarea id="postIngredients" placeholder="Ingredients list..." required></textarea>
    <textarea id="postInstructions" placeholder="Cooking steps..." required></textarea>
    <input type="file" id="postImage" accept="image/*" required>
    <button type="submit">Publish Dish</button>
  </form>
</div>
    
<div class="container">

    <h2>Popular Recipes</h2>

    <div class="recipes" id="recipeContainer"></div>

</div>

<div class="modal" id="recipeModal">

    <div class="modal-box">

        <button class="close" onclick="closeModal()">×</button>

        <img id="modalImage">

        <h2 id="modalTitle"></h2>

        <p id="modalDescription"></p>

        <h3>🥘 Ingredients</h3>

        <ul id="ingredients"></ul>

        <h3>👨‍🍳 Instructions</h3>

        <ol id="instructions"></ol>

    </div>

</div>

<footer>
    <p>© 2026 Foodie Recipes</p>
    <p>Made with ❤️ for food lovers</p>
</footer>

,

function displayRecipes(list) {
    const container = document.getElementById("recipeContainer");

    if (list.length === 0) {
        container.innerHTML = '<div class="no-results">No recipes found 😔</div>';
        return;
    }

    container.innerHTML = list.map((recipe, index) => `
        <div class="card">
            <img class="card-img" src="${recipe.image}" alt="${recipe.title}">
            <div class="card-content">
                <h3>${recipe.title}</h3>
                <p>${recipe.description}</p>
                <div class="buttons">
                    <button class="view-btn" onclick="viewRecipeByName('${recipe.title.replace(/'/g, "\\'")}')">
                    
                        View Recipe
                    </button>
                    <button class="favorite" onclick="toggleFavorite(this)">
                        ♡
                    </button>
                </div>
            </div>
        </div>
    `).join("");
}

function viewRecipeByName(title) {
    const recipe = recipes.find(r => r.title === title);


    document.getElementById("modalImage").src = recipe.image;
    document.getElementById("modalTitle").textContent = recipe.title;
    document.getElementById("modalDescription").textContent = recipe.description;

    document.getElementById("ingredients").innerHTML =
        recipe.ingredients.map(item => `<li>${item}</li>`).join("");

    document.getElementById("instructions").innerHTML =
        recipe.instructions.map(item => `<li>${item}</li>`).join("");

    document.getElementById("recipeModal").style.display = "block";
}

function closeModal() {
    document.getElementById("recipeModal").style.display = "none";
}

function toggleFavorite(button) {
    button.classList.toggle("active");
    button.textContent = button.classList.contains("active") ? "♥" : "♡";
}

function searchRecipes() {
    const search = document.getElementById("search").value.toLowerCase();

    const filtered = recipes.filter(recipe =>
        recipe.title.toLowerCase().includes(search) ||
        recipe.description.toLowerCase().includes(search) ||
        recipe.category.toLowerCase().includes(search)
    );

    displayRecipes(filtered);
}

function filterCategory(category) {
    if (category === "All") {
        displayRecipes(recipes);
        return;
    }

    const filtered = recipes.filter(recipe =>
        recipe.category === category
    );

    displayRecipes(filtered);
}

displayRecipes(recipes);

window.onclick = function(event) {
    const modal = document.getElementById("recipeModal");

    if (event.target === modal) {
        closeModal();
    }
};
</script>

</body>
</html>
